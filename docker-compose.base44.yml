services:
  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - SUPABASE_URL=${SUPABASE_URL:-https://c--8601cd84-bc7a-4cd0-8055-e85fefa8225e-prod.lovable.cloud}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_uLbxeQ511N97wrXhbKZjtg_SVTwQlqC}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://c--8601cd84-bc7a-4cd0-8055-e85fefa8225e-prod.lovable.cloud}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_uLbxeQ511N97wrXhbKZjtg_SVTwQlqC}
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "npm install --global bun && bun install --frozen-lockfile && exec bun run dev -- --host 0.0.0.0 --port 3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)throw 1}).catch(()=>{throw 1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  web_node_modules:
